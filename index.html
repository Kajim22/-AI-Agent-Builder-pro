<script>
(function(){'use strict';
const frame=document.getElementById('agenthub-frame'),paymentButton=document.getElementById('akexa-payments-launch'),payOverlay=document.getElementById('akexa-parent-pay'),payBody=document.getElementById('akexa-parent-pay-body'),API='https://kajim-ai-agent-backend.onrender.com',SUPABASE_URL='https://yhspipyrgdcdfqqxxges.supabase.co',SUPABASE_KEY='sb_publishable_IcyDHTLjyPPspvcgnYZZiw_q1lUn8QW',PAYMENT_FUNCTION=SUPABASE_URL+'/functions/v1/create-marketplace-payment';
let sb=null;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\\"/g,'&quot;').replace(/'/g,'&#039;')}
function loadSupabase(){if(sb)return Promise.resolve(sb);return new Promise((resolve,reject)=>{if(window.supabase?.createClient){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);resolve(sb);return}const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js';s.onload=()=>{try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);resolve(sb)}catch(e){reject(e)}};s.onerror=()=>reject(new Error('Supabase SDK could not load'));document.head.appendChild(s)})}
function marketplaceTheme(doc){if(!doc||doc.getElementById('akexa-marketplace-theme'))return;const style=doc.createElement('style');style.id='akexa-marketplace-theme';style.textContent=`:root{--accent:#8b5cf6!important;--accent2:#a78bfa!important;--accent3:#c4b5fd!important;--surface:#10101b!important;--surface2:#171725!important;--surface3:#202034!important;--border:#2b2b42!important;--border2:#3a3a55!important;--bg:#08080f!important}body{background:radial-gradient(circle at 80% -10%,rgba(139,92,246,.12),transparent 32%),var(--bg)!important}.sidebar{background:rgba(13,13,22,.96)!important;border-right-color:#29293e!important}.logo-wrap{padding:20px 18px!important}.logo-icon{background:linear-gradient(135deg,#7c3aed,#c084fc)!important;border-radius:12px!important}.logo-name{font-size:17px!important}.logo-tag{letter-spacing:.7px!important}.nav-item{padding:12px!important}.nav-item:hover{background:rgba(139,92,246,.09)!important}.nav-item.active{background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(192,132,252,.08))!important;border-color:rgba(167,139,250,.25)!important}.main{background:transparent!important}.topbar{padding:15px 28px!important;background:rgba(8,8,15,.78)!important;border-bottom-color:#29293e!important}.content{max-width:1100px!important;padding:26px 30px 60px!important;gap:20px!important}.card{background:rgba(16,16,27,.92)!important;border-color:#2b2b42!important;border-radius:17px!important;box-shadow:0 10px 35px rgba(0,0,0,.22)!important}.card-header{background:linear-gradient(135deg,rgba(25,25,40,.96),rgba(16,16,27,.96))!important}.card-title{font-size:14px!important}.btn-primary{background:linear-gradient(135deg,#7c3aed,#a855f7)!important}.int-card,.stat-card{background:rgba(23,23,37,.9)!important;border-color:#2b2b42!important}.akexa-market-hero{background:linear-gradient(135deg,rgba(124,58,237,.2),rgba(168,85,247,.08) 55%,rgba(16,16,27,.95))!important;border:1px solid rgba(167,139,250,.28)!important;border-radius:20px!important;padding:25px!important;margin-bottom:2px!important;position:relative;overflow:hidden}.akexa-market-hero:after{content:'✦';position:absolute;right:28px;top:10px;font-size:100px;color:rgba(196,181,253,.06)}.akexa-market-kicker{font-size:11px;color:#c4b5fd;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.akexa-market-hero h1{margin:7px 0 8px;font-size:28px;line-height:1.15}.akexa-market-hero p{margin:0;color:#aaaac0;max-width:620px;line-height:1.7}.akexa-market-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.akexa-market-nav{border:1px solid rgba(167,139,250,.25)!important;background:rgba(139,92,246,.08)!important;color:#c4b5fd!important}`;doc.head.appendChild(style);
const logo=doc.querySelector('.logo-name');if(logo)logo.textContent='AKEXA AI Bazar';const tag=doc.querySelector('.logo-tag');if(tag)tag.textContent='Build AI Agents. Automate Businesses.';
const nav=doc.querySelector('.sidebar-nav');if(nav&&!doc.getElementById('akexa-bazar-nav')){const group=doc.createElement('div');group.className='nav-group-label';group.textContent='Marketplace';const item=doc.createElement('div');item.className='nav-item akexa-market-nav';item.id='akexa-bazar-nav';item.innerHTML='<span class="nav-icon">🛒</span><span>AI Bazar</span><span class="nav-badge">NEW</span>';item.onclick=()=>{if(typeof window.openMarketplace==='function')window.openMarketplace();else{loadScript(window,doc,'akexa-bazar-script','./marketplace.js?v=20260918d');setTimeout(()=>{if(typeof window.akexaBazarOpen==='function')window.akexaBazarOpen();else if(typeof window.openMarketplace==='function')window.openMarketplace();else alert('AI Bazar module could not be loaded. Please refresh.');},700);}};nav.prepend(item,group)}
const content=doc.querySelector('.content');if(content&&!doc.getElementById('akexa-market-hero')){const hero=doc.createElement('div');hero.id='akexa-market-hero';hero.className='akexa-market-hero';hero.innerHTML='<div class="akexa-market-kicker">AKEXA AI BAZAR</div><h1>Build, Buy & Sell AI Agents</h1><p>নিজের ব্যবসার জন্য AI Agent তৈরি করুন, অন্যদের তৈরি Agent ব্যবহার করুন, অথবা আপনার Agent মাসিক সাবস্ক্রিপশনে বিক্রি করুন।</p><div class="akexa-market-actions"><button class="btn btn-primary" type="button" id="akexa-browse-btn">🛒 Browse AI Agents</button><button class="btn btn-ghost" type="button" id="akexa-sell-btn">🚀 Sell Your Agent</button></div>';content.prepend(hero);hero.querySelector('#akexa-browse-btn').onclick=()=>typeof window.openMarketplace==='function'?window.openMarketplace():null;hero.querySelector('#akexa-sell-btn').onclick=()=>{const add=doc.querySelector('.add-agent-btn');if(add)add.click();else if(typeof window.showSection==='function')window.showSection('create')};}
}
function loadScript(win,doc,id,src){if(doc.getElementById(id))return;const s=doc.createElement('script');s.id=id;s.src=src;doc.body.appendChild(s)}
async function openPayments(){payOverlay.classList.add('open');payBody.innerHTML='<div style="padding:25px;text-align:center;color:#9090b0">Payments loading...</div>';try{const client=await loadSupabase();const {data:{user}}=await client.auth.getUser();if(!user){payBody.innerHTML='<div style="padding:25px;text-align:center;color:#9090b0">প্রথমে AKEXA AI Bazar-এ Login করুন।</div>';return}const {data:rows,error}=await client.from('marketplace_payments').select('id,subscription_id,gateway,gateway_reference,amount,status,checkout_url,paid_at,created_at').eq('buyer_user_id',user.id).order('created_at',{ascending:false});if(error)throw error;const items=(rows||[]).map(p=>`<div class="akexa-parent-row"><strong>Payment #${esc(p.gateway_reference)}</strong><div class="akexa-parent-meta">Amount: ৳${esc(Number(p.amount).toFixed(2))}<br>Gateway: ${esc(p.gateway)}<br>Status: <span class="akexa-parent-status">${esc(p.status)}</span><br>Created: ${esc(new Date(p.created_at).toLocaleString())}</div>${p.status==='created'||p.status==='pending'?`<button class="akexa-parent-btn" data-payment="${esc(p.id)}">Continue Payment</button>`:''}</div>`).join('');payBody.innerHTML=(items||'<div style="padding:25px;text-align:center;color:#9090b0">No payment transactions yet.</div>')+'<div class="akexa-parent-note">Gateway credentials are not configured yet. The current screen only creates payment records; it does not charge money.</div>';payBody.querySelectorAll('[data-payment]').forEach(b=>b.onclick=()=>continuePayment(b.dataset.payment))}catch(e){payBody.innerHTML='<div style="padding:25px;color:#ff8080">Payment history load failed: '+esc(e.message)+'</div>'}}
async function continuePayment(paymentId){try{const client=await loadSupabase();const {data:{session}}=await client.auth.getSession();if(!session?.access_token){alert('Login session পাওয়া যায়নি।');return}const {data:p,error}=await client.from('marketplace_payments').select('id,subscription_id,status,gateway').eq('id',paymentId).single();if(error||!p){alert('Payment not found.');return}if(!['created','pending'].includes(p.status)){alert('এই payment আর payable নয়।');return}const gateway=(p.gateway||'sslcommerz').trim().toLowerCase();const res=await fetch(PAYMENT_FUNCTION,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({subscription_id:p.subscription_id,gateway})});const data=await res.json().catch(()=>({}));if(!res.ok){alert('Payment setup failed: '+(data.error||'Unknown error'));return}if(data.checkout_url)window.open(data.checkout_url,'_blank','noopener');else alert('Payment transaction created.\nReference: '+(data.payment?.gateway_reference||'')+'\n\n'+(data.message||'Gateway checkout এখনও configured নয়—কোনো টাকা কাটা হয়নি।'));openPayments()}catch(e){alert('Payment error: '+e.message)}}
paymentButton.addEventListener('click',openPayments);document.getElementById('akexa-parent-close').onclick=()=>payOverlay.classList.remove('open');

})();
