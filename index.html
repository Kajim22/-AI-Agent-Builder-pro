<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKEXA AI Bazar</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080810}
#agenthub-frame{border:0;width:100%;height:100%;display:block}
#akexa-nav{position:fixed;top:12px;right:14px;z-index:1400;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 28px)}
.akexa-nav-btn{border:1px solid rgba(168,156,255,.35);border-radius:10px;padding:9px 11px;background:rgba(15,15,26,.94);backdrop-filter:blur(10px);color:#eee;font:700 12px Inter,Arial,sans-serif;box-shadow:0 8px 25px rgba(0,0,0,.25);cursor:pointer}.akexa-nav-btn:hover{background:#1b1b2d}.akexa-nav-primary{background:linear-gradient(135deg,#6c63ff,#a855f7);border-color:transparent}
#akexa-overlay{position:fixed;inset:0;z-index:1500;background:rgba(3,3,9,.86);backdrop-filter:blur(8px);display:none;overflow:auto;padding:22px}.akexa-overlay.open{display:block}.akexa-box{max-width:1050px;margin:34px auto;background:#0f0f1a;border:1px solid #2a2a40;border-radius:16px;color:#f0f0ff;overflow:hidden;font-family:Inter,Arial,sans-serif}.akexa-head{padding:20px;border-bottom:1px solid #2a2a40;display:flex;justify-content:space-between;align-items:center;gap:12px}.akexa-head h2{margin:0;font-size:20px}.akexa-head p{margin:5px 0 0;color:#9090b0;font-size:12px}.akexa-close{background:transparent;border:1px solid #353550;color:#aaa;border-radius:8px;padding:7px 11px;cursor:pointer}.akexa-body{padding:20px}.akexa-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.akexa-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.akexa-card{padding:16px;border:1px solid #2a2a40;border-radius:12px;background:#161626}.akexa-card h3{margin:0 0 7px;font-size:15px}.akexa-card p{margin:0 0 10px;color:#9090b0;font-size:12px;line-height:1.55}.akexa-meta{font-size:11px;color:#aaaac0;line-height:1.8}.akexa-price{color:#b8adff;font-weight:700}.akexa-btn{border:0;border-radius:8px;padding:9px 12px;background:linear-gradient(135deg,#6c63ff,#a855f7);color:#fff;font-weight:700;cursor:pointer;margin-top:9px}.akexa-btn.secondary{background:#24243a;border:1px solid #383850}.akexa-empty{padding:35px;text-align:center;color:#9090b0;border:1px dashed #353550;border-radius:12px}.akexa-status{padding:10px 12px;border-radius:8px;background:#171725;color:#aaaac0;font-size:12px;margin-bottom:12px}.akexa-error{color:#ff9292}.akexa-success{color:#7ee2a8}
#akexa-payments-launch{position:fixed;right:18px;bottom:18px;z-index:1400;border:1px solid rgba(168,156,255,.45);border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#6c63ff,#a855f7);color:#fff;font:700 13px Inter,Arial,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.35);cursor:pointer}
@media(max-width:700px){#akexa-nav{left:10px;right:10px;top:10px;justify-content:flex-end}.akexa-nav-btn{font-size:11px;padding:8px 9px}.akexa-nav-btn.hide-mobile{display:none}#akexa-payments-launch{right:12px;bottom:12px;padding:10px 13px;font-size:12px}.akexa-overlay{padding:10px}.akexa-box{margin:10px auto}.akexa-body,.akexa-head{padding:16px}}
</style>
</head>
<body>
<iframe id="agenthub-frame" src="./app-core.html"></iframe>
<div id="akexa-nav">
  <button class="akexa-nav-btn akexa-nav-primary" id="akexa-bazar-btn">🛒 AI Bazar</button>
  <button class="akexa-nav-btn" id="akexa-sub-btn">📦 Subscriptions</button>
  <button class="akexa-nav-btn" id="akexa-account-btn">👤 Account</button>
</div>
<button id="akexa-payments-launch" type="button">💳 Payments</button>
<div id="akexa-overlay"><div class="akexa-box"><div class="akexa-head"><div><h2 id="akexa-title">AKEXA AI Bazar</h2><p id="akexa-subtitle">Build AI Agents. Automate Businesses.</p></div><button class="akexa-close" id="akexa-close">Close</button></div><div class="akexa-body" id="akexa-body">Loading...</div></div></div>
<script>
(function(){
'use strict';
const frame=document.getElementById('agenthub-frame');
const API='https://kajim-ai-agent-backend.onrender.com';
const SUPABASE_URL='https://yhspipyrgdcdfqqxxges.supabase.co';
const SUPABASE_KEY='sb_publishable_IcyDHTLjyPPspvcgnYZZiw_q1lUn8QW';
const PAYMENT_FUNCTION=SUPABASE_URL+'/functions/v1/create-marketplace-payment';
const SUBSCRIPTION_FUNCTION=SUPABASE_URL+'/functions/v1/create-marketplace-subscription';
let sb=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
function loadSupabase(){if(sb)return Promise.resolve(sb);return new Promise((resolve,reject)=>{if(window.supabase?.createClient){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);resolve(sb);return}const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js';s.onload=()=>{try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);resolve(sb)}catch(e){reject(e)}};s.onerror=()=>reject(new Error('Supabase SDK could not load'));document.head.appendChild(s)})}
function openPanel(title,subtitle,html){$('akexa-title').textContent=title;$('akexa-subtitle').textContent=subtitle||'';$('akexa-body').innerHTML=html;$('akexa-overlay').classList.add('open')}
function closePanel(){$('akexa-overlay').classList.remove('open')}
$('akexa-close').onclick=closePanel;
async function openBazar(){
  openPanel('🛒 AI Bazar','Build AI Agents. Automate Businesses.','<div class="akexa-status">Marketplace loading...</div>');
  try{const client=await loadSupabase();const {data,error}=await client.from('marketplace_agents').select('id,name,description,category,monthly_price,status').eq('status','published').order('created_at',{ascending:false});if(error)throw error;const rows=data||[];if(!rows.length){$('akexa-body').innerHTML='<div class="akexa-empty">এখনও কোনো published Agent নেই।<br>প্রথমে Agent তৈরি করে Bazar-এ publish করুন।</div>';return}$('akexa-body').innerHTML='<div class="akexa-toolbar"><button class="akexa-btn secondary" id="akexa-bazar-refresh">Refresh</button></div><div class="akexa-card-grid">'+rows.map(a=>`<div class="akexa-card"><h3>🤖 ${esc(a.name)}</h3><p>${esc(a.description||'AI agent for business automation.')}</p><div class="akexa-meta">Category: ${esc(a.category||'Business')}<br><span class="akexa-price">${Number(a.monthly_price)>0?'৳'+Number(a.monthly_price).toFixed(2)+' / month':'Free'}</span></div><button class="akexa-btn" data-agent="${esc(a.id)}">View / Get Agent</button></div>`).join('')+'</div>';$('akexa-bazar-refresh').onclick=openBazar;$('akexa-body').querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>getAgent(b.dataset.agent));}catch(e){$('akexa-body').innerHTML='<div class="akexa-status akexa-error">Marketplace load failed: '+esc(e.message)+'</div>'}
}
async function getAgent(id){
  try{const client=await loadSupabase();const {data:{user}}=await client.auth.getUser();if(!user){$('akexa-body').insertAdjacentHTML('afterbegin','<div class="akexa-status">Get Agent করতে আগে Account তৈরি/Login করুন।</div>');openAccount();return}const {data:sessionData}=await client.auth.getSession();const token=sessionData?.session?.access_token;if(!token)throw new Error('Login session পাওয়া যায়নি');const res=await fetch(SUBSCRIPTION_FUNCTION,{method:'POST',headers:{Authorization:'Bearer '+token,'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({marketplace_agent_id:id})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Subscription request failed');openPanel('📦 Subscription Created','Your Agent subscription request',`<div class="akexa-status akexa-success">Subscription created successfully.</div><div class="akexa-card"><div class="akexa-meta">Status: <b>${esc(data.subscription?.status||'pending')}</b><br>Payment gateway এখনো connected নয়। কোনো টাকা charge হয়নি।</div><button class="akexa-btn" id="go-payments">Go to Payments</button></div>`);$('go-payments').onclick=openPayments}catch(e){alert('Get Agent failed: '+e.message)}
}
async function openSubscriptions(){
  openPanel('📦 My Subscriptions','Agents you have subscribed to','<div class="akexa-status">Loading...</div>');
  try{const client=await loadSupabase();const {data:{user}}=await client.auth.getUser();if(!user){$('akexa-body').innerHTML='<div class="akexa-empty">প্রথমে Login/Create account করুন।<br><button class="akexa-btn" id="sub-account">Open Account</button></div>';$('sub-account').onclick=openAccount;return}const {data,error}=await client.from('marketplace_subscriptions').select('id,marketplace_agent_id,status,monthly_price,started_at,current_period_end,created_at').eq('buyer_user_id',user.id).order('created_at',{ascending:false});if(error)throw error;const rows=data||[];if(!rows.length){$('akexa-body').innerHTML='<div class="akexa-empty">আপনার কোনো subscription নেই।<br><button class="akexa-btn" id="browse-bazar">Browse AI Bazar</button></div>';$('browse-bazar').onclick=openBazar;return}$('akexa-body').innerHTML='<div class="akexa-card-grid">'+rows.map(s=>`<div class="akexa-card"><h3>🤖 Agent Subscription</h3><div class="akexa-meta">Price: ৳${Number(s.monthly_price||0).toFixed(2)} / month<br>Status: <b>${esc(s.status)}</b><br>Created: ${esc(new Date(s.created_at).toLocaleString())}<br>Period end: ${s.current_period_end?esc(new Date(s.current_period_end).toLocaleString()):'Not active yet'}</div></div>`).join('')+'</div>'}catch(e){$('akexa-body').innerHTML='<div class="akexa-status akexa-error">Subscriptions load failed: '+esc(e.message)+'</div>'}
}
async function openAccount(){
  openPanel('👤 My Account','AKEXA AI Bazar account','<div class="akexa-status">Loading account...</div>');
  try{const client=await loadSupabase();const {data:{user}}=await client.auth.getUser();if(!user){$('akexa-body').innerHTML='<div class="akexa-empty">আপনি এখনো Login করেননি।<br><button class="akexa-btn" id="account-login">Login / Create Account</button></div>';$('account-login').onclick=()=>alert('Marketplace login flow will open from Get Agent.');return}const {count}=await client.from('marketplace_agents').select('id',{count:'exact',head:true}).eq('owner_user_id',user.id);const {count:subs}=await client.from('marketplace_subscriptions').select('id',{count:'exact',head:true}).eq('buyer_user_id',user.id);$('akexa-body').innerHTML=`<div class="akexa-card"><h3>👤 Account</h3><div class="akexa-meta">Email: ${esc(user.email||'')}<br>User ID: ${esc(user.id)}<br>My Agents: ${count??0}<br>My Subscriptions: ${subs??0}</div><button class="akexa-btn secondary" id="account-signout">Sign out</button></div>`;$('account-signout').onclick=async()=>{await client.auth.signOut();openAccount()}}catch(e){$('akexa-body').innerHTML='<div class="akexa-status akexa-error">Account load failed: '+esc(e.message)+'</div>'}
}
async function openPayments(){
  openPanel('💳 Payments','AKEXA AI Bazar payment transactions','<div class="akexa-status">Payments loading...</div>');
  try{const client=await loadSupabase();const {data:{user}}=await client.auth.getUser();if(!user){$('akexa-body').innerHTML='<div class="akexa-empty">প্রথমে AKEXA AI Bazar-এ Login করুন।</div>';return}const {data:rows,error}=await client.from('marketplace_payments').select('id,subscription_id,gateway,gateway_reference,amount,status,checkout_url,paid_at,created_at').eq('buyer_user_id',user.id).order('created_at',{ascending:false});if(error)throw error;const items=(rows||[]).map(p=>`<div class="akexa-card"><h3>Payment #${esc(p.gateway_reference)}</h3><div class="akexa-meta">Amount: ৳${Number(p.amount).toFixed(2)}<br>Gateway: ${esc(p.gateway)}<br>Status: <b>${esc(p.status)}</b><br>Created: ${esc(new Date(p.created_at).toLocaleString())}</div>${['created','pending'].includes(p.status)?`<button class="akexa-btn" data-payment="${esc(p.id)}">Continue Payment</button>`:''}</div>`).join('');$('akexa-body').innerHTML=(items||'<div class="akexa-empty">No payment transactions yet.</div>')+'<div class="akexa-status">Gateway credentials are not configured yet. Current screen does not charge money.</div>';$('akexa-body').querySelectorAll('[data-payment]').forEach(b=>b.onclick=()=>continuePayment(b.dataset.payment))}catch(e){$('akexa-body').innerHTML='<div class="akexa-status akexa-error">Payment history load failed: '+esc(e.message)+'</div>'}
}
async function continuePayment(paymentId){try{const client=await loadSupabase();const {data:{session}}=await client.auth.getSession();if(!session?.access_token){alert('Login session পাওয়া যায়নি।');return}const {data:p,error}=await client.from('marketplace_payments').select('id,subscription_id,status,gateway').eq('id',paymentId).single();if(error||!p)throw new Error('Payment not found');if(!['created','pending'].includes(p.status))throw new Error('এই payment আর payable নয়');const gateway=prompt('Gateway: sslcommerz, bkash, nagad',p.gateway||'sslcommerz');if(!gateway)return;const res=await fetch(PAYMENT_FUNCTION,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({subscription_id:p.subscription_id,gateway:gateway.trim().toLowerCase()})});const data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error||'Payment setup failed');if(data.checkout_url)window.open(data.checkout_url,'_blank','noopener');else alert('Payment transaction created. Gateway checkout এখনও configured নয়—কোনো টাকা কাটা হয়নি।');openPayments()}catch(e){alert('Payment error: '+e.message)}}
function loadScript(doc,id,src){if(doc.getElementById(id))return;const s=doc.createElement('script');s.id=id;s.src=src;doc.body.appendChild(s)}
async function syncFacebookState(win,agentId){if(!agentId)return;try{const res=await fetch(API+'/facebook/list',{cache:'no-store'});if(!res.ok)return;const pages=await res.json();if(!Array.isArray(pages))return;const connected=pages.filter(p=>String(p.agent_id||'')===String(agentId));const card=win.document.getElementById('c-fb'),status=win.document.getElementById('s-fb');if(!card||!status)return;if(connected.length){card.classList.add('connected');status.textContent='✅ কানেক্টেড'+(connected.length>1?': '+connected.length+' Pages':'')}else{card.classList.remove('connected');status.textContent='কানেক্ট করুন'}}catch(err){console.warn('Facebook state sync failed:',err.message)}}
frame.addEventListener('load',function(){const win=frame.contentWindow,doc=frame.contentDocument;if(!doc)return;if(doc.title)doc.title='AKEXA AI Bazar';const logo=doc.querySelector('.logo-name');if(logo)logo.textContent='AKEXA AI Bazar';const tag=doc.querySelector('.logo-tag');if(tag)tag.textContent='Build AI Agents. Automate Businesses.';loadScript(doc,'advanced-kb-script','./advanced-kb.js');loadScript(doc,'customer-dashboard-script','./customer-dashboard.js');loadScript(doc,'smart-orders-script','./smart-orders.js');loadScript(doc,'website-widget-dashboard-script','./widget-dashboard.js');loadScript(doc,'akexa-bazar-script','./marketplace.js');loadScript(doc,'akexa-sub-dashboard-script','./marketplace-dashboard.js');loadScript(doc,'akexa-payments-script','./marketplace-payments.js');const originalSelect=win.selectAgent;if(typeof originalSelect==='function'&&!win.__facebookPersistenceInstalled){win.selectAgent=function(id){const result=originalSelect.apply(this,arguments);syncFacebookState(win,id);const share=doc.getElementById('share-link-text');if(share)share.textContent=location.origin+location.pathname+'?agent='+encodeURIComponent(id);return result};win.__facebookPersistenceInstalled=true}const aid=new URLSearchParams(location.search).get('agent');if(aid&&win.agents&&win.agents.find(a=>a.id===aid)&&typeof win.selectAgent==='function'){win.selectAgent(aid);if(typeof win.showSection==='function')win.showSection('test')}else if(win.activeId)syncFacebookState(win,win.activeId)});
$('akexa-bazar-btn').onclick=openBazar;$('akexa-sub-btn').onclick=openSubscriptions;$('akexa-account-btn').onclick=openAccount;$('akexa-payments-launch').onclick=openPayments;
})();
</script>
</body>
</html>
