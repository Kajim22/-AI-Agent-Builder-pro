<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKEXA AI Bazar</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080810}
#agenthub-frame{border:0;width:100%;height:100%;display:block}
#akexa-payments-launch{position:fixed;right:18px;bottom:18px;z-index:1000;border:1px solid rgba(168,156,255,.45);border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#6c63ff,#a855f7);color:#fff;font:700 13px Inter,Arial,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.35);cursor:pointer}
#akexa-payments-launch:hover{transform:translateY(-1px)}
@media(max-width:600px){#akexa-payments-launch{right:12px;bottom:12px;padding:10px 13px;font-size:12px}}
</style>
</head>
<body>
<iframe id="agenthub-frame" src="./app-core.html"></iframe>
<button id="akexa-payments-launch" type="button">💳 Payments</button>
<script>
(function(){
const frame=document.getElementById('agenthub-frame'),paymentButton=document.getElementById('akexa-payments-launch'),API='https://kajim-ai-agent-backend.onrender.com';
function applyBranding(doc){if(!doc)return;if(doc.title)doc.title='AKEXA AI Bazar';const logo=doc.querySelector('.logo-name');if(logo)logo.textContent='AKEXA AI Bazar';const tag=doc.querySelector('.logo-tag');if(tag)tag.textContent='Build AI Agents. Automate Businesses.'}
function loadScript(win,doc,id,src){if(doc.getElementById(id))return;const s=doc.createElement('script');s.id=id;s.src=src;doc.body.appendChild(s)}
async function syncFacebookState(win,agentId){if(!agentId)return;try{const res=await fetch(API+'/facebook/list',{cache:'no-store'});if(!res.ok)return;const pages=await res.json();if(!Array.isArray(pages))return;const connected=pages.filter(p=>String(p.agent_id||'')===String(agentId));const card=win.document.getElementById('c-fb'),status=win.document.getElementById('s-fb');if(!card||!status)return;if(connected.length){card.classList.add('connected');status.textContent='✅ কানেক্টেড'+(connected.length>1?': '+connected.length+' Pages':'')}else{card.classList.remove('connected');status.textContent='কানেক্ট করুন'}}catch(err){console.warn('Facebook state sync failed:',err.message)}}
function findPaymentNav(){const doc=frame.contentDocument;return doc&&doc.getElementById('akexa-pay-nav')}
function openPayments(){const item=findPaymentNav();if(item){item.click();return}let tries=0;const timer=setInterval(()=>{const retry=findPaymentNav();if(retry){clearInterval(timer);retry.click()}else if(++tries>=20){clearInterval(timer);alert('Payments module load হয়নি। Refresh করে আবার চেষ্টা করুন।')}},250)}
paymentButton.addEventListener('click',openPayments);
frame.addEventListener('load',function(){const win=frame.contentWindow,doc=frame.contentDocument;applyBranding(doc);loadScript(win,doc,'advanced-kb-script','./advanced-kb.js');loadScript(win,doc,'customer-dashboard-script','./customer-dashboard.js');loadScript(win,doc,'smart-orders-script','./smart-orders.js');loadScript(win,doc,'website-widget-dashboard-script','./widget-dashboard.js');loadScript(win,doc,'akexa-bazar-script','./marketplace.js');loadScript(win,doc,'akexa-sub-dashboard-script','./marketplace-dashboard.js');loadScript(win,doc,'akexa-payments-script','./marketplace-payments.js');const originalSelect=win.selectAgent;if(typeof originalSelect==='function'&&!win.__facebookPersistenceInstalled){win.selectAgent=function(id){const result=originalSelect.apply(this,arguments);syncFacebookState(win,id);const share=doc.getElementById('share-link-text');if(share)share.textContent=location.origin+location.pathname+'?agent='+encodeURIComponent(id);return result};win.__facebookPersistenceInstalled=true}const aid=new URLSearchParams(location.search).get('agent');if(aid&&win.agents&&win.agents.find(a=>a.id===aid)&&typeof win.selectAgent==='function'){win.selectAgent(aid);if(typeof win.showSection==='function')win.showSection('test')}else if(win.activeId)syncFacebookState(win,win.activeId)});
})();
</script>
</body>
</html>
