<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentHub Pro</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080810}#agenthub-frame{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="agenthub-frame" src="./app-core.html"></iframe>
<script>
(function(){
  const frame=document.getElementById('agenthub-frame');
  const API='https://kajim-ai-agent-backend.onrender.com';
  async function syncFacebookState(win,agentId){
    if(!agentId)return;
    try{
      const res=await fetch(API+'/facebook/list',{cache:'no-store'});
      if(!res.ok)return;
      const pages=await res.json();
      if(!Array.isArray(pages))return;
      const connected=pages.filter(p=>String(p.agent_id||'')===String(agentId));
      const card=win.document.getElementById('c-fb');
      const status=win.document.getElementById('s-fb');
      if(!card||!status)return;
      if(connected.length){
        card.classList.add('connected');
        status.textContent='✅ কানেক্টেড'+(connected.length>1?': '+connected.length+' Pages':'');
      }else{
        card.classList.remove('connected');
        status.textContent='কানেক্ট করুন';
      }
    }catch(err){console.warn('Facebook state sync failed:',err.message)}
  }
  frame.addEventListener('load',function(){
    const win=frame.contentWindow;
    const doc=frame.contentDocument;
    const originalSelect=win.selectAgent;
    if(typeof originalSelect==='function'&&!win.__facebookPersistenceInstalled){
      win.selectAgent=function(id){
        const result=originalSelect.apply(this,arguments);
        syncFacebookState(win,id);
        const share=doc.getElementById('share-link-text');
        if(share)share.textContent=location.origin+location.pathname+'?agent='+encodeURIComponent(id);
        return result;
      };
      win.__facebookPersistenceInstalled=true;
    }
    const aid=new URLSearchParams(location.search).get('agent');
    if(aid&&win.agents&&win.agents.find(a=>a.id===aid)&&typeof win.selectAgent==='function'){
      win.selectAgent(aid);
      if(typeof win.showSection==='function')win.showSection('test');
    }else if(win.activeId){
      syncFacebookState(win,win.activeId);
    }
  });
})();
</script>
</body>
</html>
