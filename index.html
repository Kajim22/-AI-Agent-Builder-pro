<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentHub Pro</title>
</head>
<body>
<div style="font-family:Arial,sans-serif;padding:30px;text-align:center">AgentHub Pro লোড হচ্ছে...</div>
<script>
(async function loadAgentHubWithPersistentFacebookState(){
  const coreUrl = './app-core.html';
  try {
    const response = await fetch(coreUrl, { cache: 'no-store' });
    if (!response.ok) throw new Error('Core app load failed: HTTP ' + response.status);
    const coreHtml = await response.text();

    const persistencePatch = `<script>
(function installFacebookPersistence(){
  const API = 'https://kajim-ai-agent-backend.onrender.com';
  async function syncFacebookConnectionState(agentId){
    if(!agentId) return;
    try{
      const res = await fetch(API + '/facebook/list', { cache:'no-store' });
      if(!res.ok) return;
      const pages = await res.json();
      if(!Array.isArray(pages)) return;
      const connectedPages = pages.filter(p => String(p.agent_id || '') === String(agentId));
      const card = document.getElementById('c-fb');
      const status = document.getElementById('s-fb');
      if(!card || !status) return;
      if(connectedPages.length){
        card.classList.add('connected');
        status.textContent = '✅ কানেক্টেড' + (connectedPages.length > 1 ? ': ' + connectedPages.length + ' Pages' : '');
      }else{
        card.classList.remove('connected');
        status.textContent = 'কানেক্ট করুন';
      }
    }catch(err){
      console.warn('Facebook connection state sync failed:', err.message);
    }
  }

  function install(){
    if(typeof window.selectAgent !== 'function'){
      setTimeout(install, 50);
      return;
    }
    const originalSelectAgent = window.selectAgent;
    if(!window.__facebookPersistenceInstalled){
      window.selectAgent = function(id){
        const result = originalSelectAgent.apply(this, arguments);
        syncFacebookConnectionState(id);
        return result;
      };
      window.__facebookPersistenceInstalled = true;
    }
    const runInitialSync = function(){
      const id = window.activeId;
      if(id) syncFacebookConnectionState(id);
    };
    if(document.readyState === 'complete') runInitialSync();
    else window.addEventListener('load', runInitialSync, { once:true });
  }

  install();
})();
<\/script>`;

    const patchedHtml = coreHtml.includes('</body>')
      ? coreHtml.replace('</body>', persistencePatch + '</body>')
      : coreHtml + persistencePatch;

    document.open();
    document.write(patchedHtml);
    document.close();
  } catch(err){
    document.body.innerHTML = '<div style="font-family:Arial,sans-serif;padding:30px;color:#b00020">AgentHub Pro লোড করা যায়নি। অনুগ্রহ করে আবার চেষ্টা করুন।</div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
