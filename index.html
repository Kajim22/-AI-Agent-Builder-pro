<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKEXA AI Bazar</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080810}
#agenthub-frame{border:0;width:100%;height:100%;display:block}
#akexa-payments-launch{position:fixed;right:18px;bottom:18px;z-index:1000;border:1px solid rgba(168,156,255,.45);border-radius:12px;padding:11px 15px;background:linear-gradient(135deg,#6c63ff,#a855f7);color:#fff;font:700 13px Inter,Arial,sans-serif;box-shadow:0 8px 28px rgba(0,0,0,.35);cursor:pointer}
#akexa-payments-launch:hover{transform:translateY(-1px)}
#akexa-parent-pay{position:fixed;inset:0;z-index:1200;background:rgba(3,3,9,.86);backdrop-filter:blur(8px);display:none;overflow:auto;padding:22px}
#akexa-parent-pay.open{display:block}
.akexa-parent-box{max-width:760px;margin:30px auto;background:#0f0f1a;border:1px solid #2a2a40;border-radius:16px;color:#f0f0ff;overflow:hidden;font-family:Inter,Arial,sans-serif}
.akexa-parent-head{padding:20px;border-bottom:1px solid #2a2a40;display:flex;justify-content:space-between;align-items:center;gap:12px}.akexa-parent-head h2{margin:0;font-size:20px}.akexa-parent-head p{margin:5px 0 0;color:#9090b0;font-size:12px}
.akexa-parent-body{padding:20px}.akexa-parent-row{padding:15px;border:1px solid #2a2a40;border-radius:12px;background:#161626;margin-bottom:10px}.akexa-parent-meta{font-size:12px;color:#aaaac0;line-height:1.8}.akexa-parent-status{font-weight:700;color:#c4bdff}.akexa-parent-btn{border:0;border-radius:8px;padding:9px 13px;background:linear-gradient(135deg,#6c63ff,#a855f7);color:white;font-weight:700;cursor:pointer;margin-top:9px}.akexa-parent-close{background:transparent;border:1px solid #353550;color:#aaa;border-radius:8px;padding:7px 11px;cursor:pointer}.akexa-parent-note{font-size:11px;color:#77778f;line-height:1.6;margin-top:15px}
@media(max-width:600px){#akexa-payments-launch{right:12px;bottom:12px;padding:10px 13px;font-size:12px}#akexa-parent-pay{padding:10px}.akexa-parent-box{margin:12px auto}.akexa-parent-body,.akexa-parent-head{padding:16px}}
</style>
</head>
<body>
<iframe id="agenthub-frame" src="./app-core.html"></iframe>
<button id="akexa-payments-launch" type="button">💳 Payments</button>
<div id="akexa-parent-pay"><div class="akexa-parent-box"><div class="akexa-parent-head"><div><h2>💳 Payments</h2><p>AKEXA AI Bazar payment transactions</p></div><button class="akexa-parent-close" id="akexa-parent-close">Close</button></div><div class="akexa-parent-body" id="akexa-parent-pay-body">Loading...</div></div></div>
<script>
(function(){
const frame=document.getElementById('agenthub-frame'),paymentButton=document.getElementById('akexa-payments-launch'),payOverlay=document.getElementById('akexa-parent-pay'),payBody=document.getElementById('akexa-parent-pay-body'),API='https://kajim-ai-agent-backend.onrender.com',SUPABASE_URL='https://yhspipyrgdcdfqqxxges.supabase.co',SUPABASE_KEY='sb_publishable_IcyDHTLjyPPspvcgnYZZiw_q1lUn8QW',PAYMENT_FUNCTION=SUPABASE_URL+'/functions/v1/create-marketplace-payment';
let sb=null;
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}
function loadSupabase(){if(sb)return Promise.resolve(sb);return new Promise((resolve,reject)=>{if(window.supabase?.createClient){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);resolve(sb);return}const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js';s.onload=()=>{try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);resolve(sb)}catch(e){reject(e)}};s.onerror=()=>reject(new Error('Supabase SDK could not load'));document.head.appendChild(s)})}
function applyBranding(doc){if(!doc)return;if(doc.title)doc.title='AKEXA AI Bazar';const logo=doc.querySelector('.logo-name');if(logo)logo.textContent='AKEXA AI Bazar';const tag=doc.querySelector('.logo-tag');if(tag)tag.textContent='Build AI Agents. Automate Businesses.'}
function loadScript(win,doc,id,src){if(doc.getElementById(id))return;const s=doc.createElement('script');s.id=id;s.src=src;doc.body.appendChild(s)}
async function syncFacebookState(win,agentId){if(!agentId)return;try{const res=await fetch(API+'/facebook/list',{cache:'no-store'});if(!res.ok)return;const pages=await res.json();if(!Array.isArray(pages))return;const connected=pages.filter(p=>String(p.agent_id||'')===String(agentId));const card=win.document.getElementById('c-fb'),status=win.document.getElementById('s-fb');if(!card||!status)return;if(connected.length){card.classList.add('connected');status.textContent='✅ কানেক্টেড'+(connected.length>1?': '+connected.length+' Pages':'')}else{card.classList.remove('connected');status.textContent='কানেক্ট করুন'}}catch(err){console.warn('Facebook state sync failed:',err.message)}}
async function openPayments(){payOverlay.classList.add('open');payBody.innerHTML='<div style="padding:25px;text-align:center;color:#9090b0">Payments loading...</div>';try{const client=await loadSupabase();const {data:{user}}=await client.auth.getUser();if(!user){payBody.innerHTML='<div style="padding:25px;text-align:center;color:#9090b0">প্রথমে AKEXA AI Bazar-এ Login করুন।</div>';return}const {data:rows,error}=await client.from('marketplace_payments').select('id,subscription_id,gateway,gateway_reference,amount,status,checkout_url,paid_at,created_at').eq('buyer_user_id',user.id).order('created_at',{ascending:false});if(error)throw error;const items=(rows||[]).map(p=>`<div class="akexa-parent-row"><strong>Payment #${esc(p.gateway_reference)}</strong><div class="akexa-parent-meta">Amount: ৳${esc(Number(p.amount).toFixed(2))}<br>Gateway: ${esc(p.gateway)}<br>Status: <span class="akexa-parent-status">${esc(p.status)}</span><br>Created: ${esc(new Date(p.created_at).toLocaleString())}</div>${p.status==='created'||p.status==='pending'?`<button class="akexa-parent-btn" data-payment="${esc(p.id)}">Continue Payment</button>`:''}</div>`).join('');payBody.innerHTML=(items||'<div style="padding:25px;text-align:center;color:#9090b0">No payment transactions yet.</div>')+'<div class="akexa-parent-note">Gateway credentials are not configured yet. The current screen only creates payment records; it does not charge money.</div>';payBody.querySelectorAll('[data-payment]').forEach(b=>b.onclick=()=>continuePayment(b.dataset.payment))}catch(e){payBody.innerHTML='<div style="padding:25px;color:#ff8080">Payment history load failed: '+esc(e.message)+'</div>'}}
async function continuePayment(paymentId){try{const client=await loadSupabase();const {data:{session}}=await client.auth.getSession();if(!session?.access_token){alert('Login session পাওয়া যায়নি।');return}const {data:p,error}=await client.from('marketplace_payments').select('id,subscription_id,status,gateway').eq('id',paymentId).single();if(error||!p){alert('Payment not found.');return}if(!['created','pending'].includes(p.status)){alert('এই payment আর payable নয়।');return}const gateway=prompt('Gateway লিখুন: sslcommerz, bkash, nagad',p.gateway||'sslcommerz');if(!gateway)return;const res=await fetch(PAYMENT_FUNCTION,{method:'POST',headers:{Authorization:'Bearer '+session.access_token,'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({subscription_id:p.subscription_id,gateway:gateway.trim().toLowerCase()})});const data=await res.json().catch(()=>({}));if(!res.ok){alert('Payment setup failed: '+(data.error||'Unknown error'));return}if(data.checkout_url)window.open(data.checkout_url,'_blank','noopener');else alert('Payment transaction created.\nReference: '+(data.payment?.gateway_reference||'')+'\n\n'+(data.message||'Gateway checkout এখনও configured নয়—কোনো টাকা কাটা হয়নি।'));openPayments()}catch(e){alert('Payment error: '+e.message)}}
paymentButton.addEventListener('click',openPayments);document.getElementById('akexa-parent-close').onclick=()=>payOverlay.classList.remove('open');
frame.addEventListener('load',function(){const win=frame.contentWindow,doc=frame.contentDocument;applyBranding(doc);loadScript(win,doc,'advanced-kb-script','./advanced-kb.js');loadScript(win,doc,'customer-dashboard-script','./customer-dashboard.js');loadScript(win,doc,'smart-orders-script','./smart-orders.js');loadScript(win,doc,'website-widget-dashboard-script','./widget-dashboard.js');loadScript(win,doc,'akexa-bazar-script','./marketplace.js');loadScript(win,doc,'akexa-sub-dashboard-script','./marketplace-dashboard.js');loadScript(win,doc,'akexa-payments-script','./marketplace-payments.js');const originalSelect=win.selectAgent;if(typeof originalSelect==='function'&&!win.__facebookPersistenceInstalled){win.selectAgent=function(id){const result=originalSelect.apply(this,arguments);syncFacebookState(win,id);const share=doc.getElementById('share-link-text');if(share)share.textContent=location.origin+location.pathname+'?agent='+encodeURIComponent(id);return result};win.__facebookPersistenceInstalled=true}const aid=new URLSearchParams(location.search).get('agent');if(aid&&win.agents&&win.agents.find(a=>a.id===aid)&&typeof win.selectAgent==='function'){win.selectAgent(aid);if(typeof win.showSection==='function')win.showSection('test')}else if(win.activeId)syncFacebookState(win,win.activeId)});
})();
</script>
</body>
</html>
